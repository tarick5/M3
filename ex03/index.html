<!doctype html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quiz interativo de JavaScript e DOM.">
    <title>Exercício 03 | Quiz JavaScript e DOM</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="contentor">
        <p class="etiqueta">Módulo 3 · Exercício 03</p>
        <h1>Quiz JavaScript e DOM</h1>
        <p class="introducao">Responde às perguntas e verifica o que sabes sobre manipulação do DOM.</p>

        <section class="cartao" aria-labelledby="titulo-quiz">
            <div class="cabecalho-quiz">
                <h2 id="titulo-quiz">Pergunta <span id="numero-pergunta">1</span></h2>
                <p id="progresso" aria-live="polite">1 de 3</p>
            </div>

            <p id="questao" class="questao"></p>
            <div id="opcoes" class="opcoes" role="group" aria-label="Opções de resposta"></div>
            <p id="mensagem" class="mensagem" aria-live="polite"></p>

            <div class="acoes">
                <button type="button" id="avancar" disabled>Confirmar resposta</button>
                <button type="button" id="reiniciar" class="secundario" hidden>Recomeçar quiz</button>
            </div>
        </section>
    </main>
</body>
</html>
